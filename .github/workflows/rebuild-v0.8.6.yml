name: Rebuild v0.8.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-v0.8.6.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install Android dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-36' 'ndk;28.2.13676358'

      - name: Test
        run: |
          flutter pub get --enforce-lockfile
          flutter test --dart-define=ALL_SOURCES=true --concurrency=1

      - name: Build APKs
        run: python3 scripts/build_android.py --tv --universal --all-sources

      - name: Prepare assets
        run: |
          mkdir -p release_out
          cp 'dist/android/zhenguojian-0.8.6+81-arm64-v8a.apk' 'release_out/zhenguojian-TV-v0.8.6-arm64-v8a.apk'
          cp 'dist/android/zhenguojian-0.8.6+81-armeabi-v7a.apk' 'release_out/zhenguojian-TV-v0.8.6-armeabi-v7a.apk'
          cp 'dist/android/zhenguojian-0.8.6+81-all.apk' 'release_out/zhenguojian-TV-v0.8.6-all.apk'
          cd release_out
          sha256sum zhenguojian-TV-v0.8.6-*.apk > SHA256SUMS.txt

      - name: Replace v0.8.6 assets
        uses: ncipollo/release-action@v1
        with:
          tag: v0.8.6
          name: 真果鉴 TV v0.8.6 · 稳定版
          artifacts: 'release_out/SHA256SUMS.txt,release_out/zhenguojian-TV-v0.8.6-all.apk,release_out/zhenguojian-TV-v0.8.6-arm64-v8a.apk,release_out/zhenguojian-TV-v0.8.6-armeabi-v7a.apk'
          allowUpdates: true
          replacesArtifacts: true
          omitBodyDuringUpdate: true
          makeLatest: true
