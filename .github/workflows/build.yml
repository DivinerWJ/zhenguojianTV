name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      all_sources:
        description: '构建真果鉴（全部站源）；关闭则只构建红果鉴'
        type: boolean
        default: true
      tv:
        description: '电视版 ABI（arm64-v8a + armeabi-v7a）'
        type: boolean
        default: true
      universal:
        description: '额外产出通用 APK'
        type: boolean
        default: true
      publish_release:
        description: '构建完成后发布到 GitHub Release'
        type: boolean
        default: true
      release_tag:
        description: '发布使用的标签（留空则用当前 ref）'
        type: string
        default: ''

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.4'
  GO_VERSION: '1.24.1'
  NDK_VERSION: '28.2.13676358'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Android NDK ${{ env.NDK_VERSION }}
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;${{ env.NDK_VERSION }}'

      - name: Export NDK path
        shell: bash
        run: |
          set -euxo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          ndk="$sdk/ndk/$NDK_VERSION"
          test -d "$ndk"
          {
            echo "ANDROID_HOME=$sdk"
            echo "ANDROID_SDK_ROOT=$sdk"
            echo "ANDROID_NDK_HOME=$ndk"
          } >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          args=()
          if [ '${{ github.event_name }}' != 'workflow_dispatch' ] || [ '${{ inputs.all_sources }}' = 'true' ]; then args+=(--all-sources); fi
          if [ '${{ github.event_name }}' != 'workflow_dispatch' ] || [ '${{ inputs.tv }}' = 'true' ]; then args+=(--tv); fi
          if [ '${{ github.event_name }}' != 'workflow_dispatch' ] || [ '${{ inputs.universal }}' = 'true' ]; then args+=(--universal); fi
          python3 scripts/build_android.py "${args[@]}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: |
            dist/android/*.apk
            dist/android/*.txt
          if-no-files-found: error
          retention-days: 14

  release:
    needs: android
    if: ${{ github.event_name == 'push' || inputs.publish_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: artifacts

      - name: List artifacts
        shell: bash
        run: |
          set -euxo pipefail
          find artifacts -type f | sort
          test -n "$(find artifacts -name '*.apk' -type f)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && 'v0.8.8' || (inputs.release_tag != '' && inputs.release_tag || github.ref_name) }}
          name: ${{ github.event_name == 'push' && 'v0.8.8' || (inputs.release_tag != '' && inputs.release_tag || github.ref_name) }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: artifacts/**/*.apk
          body: |
            ## 0.8.8

            **新增站源**
            - 野果短剧：接入当前 Nuxt/AES 协议，逐集解析并校验正片播放地址
            - 香蕉短剧：接入 guest session + full playback session，逐集验证完整播放

            **播放策略**
            - 两个新站源均按整剧逐集正片验证后展示，拒绝试看地址降级
            - 保留现有 0.8.7 全部站源与播放能力

            **构建**
            - Flutter 3.47.4 / Go 1.24.1 / NDK 28.2.13676358
            - 产出 TV ABI APK 与 universal APK
