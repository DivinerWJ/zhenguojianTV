name: Build APK

on:
  workflow_dispatch:
    inputs:
      all_sources:
        description: '构建真果鉴（全部站源）；关闭则只构建红果鉴'
        type: boolean
        default: true
      tv:
        description: '电视版 ABI（arm64-v8a + armeabi-v7a）'
        type: boolean
        default: true
      universal:
        description: '额外产出通用 APK'
        type: boolean
        default: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.4'
  GO_VERSION: '1.24.1'
  NDK_VERSION: '28.2.13676358'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Android NDK ${{ env.NDK_VERSION }}
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;${{ env.NDK_VERSION }}'

      - name: Export NDK path
        shell: bash
        run: |
          set -euxo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          ndk="$sdk/ndk/$NDK_VERSION"
          test -d "$ndk"
          {
            echo "ANDROID_HOME=$sdk"
            echo "ANDROID_SDK_ROOT=$sdk"
            echo "ANDROID_NDK_HOME=$ndk"
          } >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          args=()
          if [ '${{ inputs.all_sources }}' = 'true' ]; then args+=(--all-sources); fi
          if [ '${{ inputs.tv }}' = 'true' ]; then args+=(--tv); fi
          if [ '${{ inputs.universal }}' = 'true' ]; then args+=(--universal); fi
          python3 scripts/build_android.py "${args[@]}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: |
            dist/android/*.apk
            dist/android/*.txt
          if-no-files-found: error
          retention-days: 14
