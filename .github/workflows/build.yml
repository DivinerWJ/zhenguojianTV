name: Build APK

on:
  workflow_dispatch:
    inputs:
      all_sources:
        description: '构建真果鉴（全部站源）；关闭则只构建红果鉴'
        type: boolean
        default: true
      tv:
        description: '电视版 ABI（arm64-v8a + armeabi-v7a）'
        type: boolean
        default: true
      universal:
        description: '额外产出通用 APK'
        type: boolean
        default: true
      publish_release:
        description: '构建完成后发布到 GitHub Release'
        type: boolean
        default: true
      release_tag:
        description: '发布使用的标签（留空则用当前 ref）'
        type: string
        default: ''

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.4'
  GO_VERSION: '1.24.1'
  NDK_VERSION: '28.2.13676358'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Android NDK ${{ env.NDK_VERSION }}
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;${{ env.NDK_VERSION }}'

      - name: Export NDK path
        shell: bash
        run: |
          set -euxo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          ndk="$sdk/ndk/$NDK_VERSION"
          test -d "$ndk"
          {
            echo "ANDROID_HOME=$sdk"
            echo "ANDROID_SDK_ROOT=$sdk"
            echo "ANDROID_NDK_HOME=$ndk"
          } >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          args=()
          if [ '${{ inputs.all_sources }}' = 'true' ]; then args+=(--all-sources); fi
          if [ '${{ inputs.tv }}' = 'true' ]; then args+=(--tv); fi
          if [ '${{ inputs.universal }}' = 'true' ]; then args+=(--universal); fi
          python3 scripts/build_android.py "${args[@]}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: |
            dist/android/*.apk
            dist/android/*.txt
          if-no-files-found: error
          retention-days: 14

  release:
    needs: android
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            README.md
            pubspec.yaml
          sparse-checkout-cone-mode: false

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: artifacts

      - name: List artifacts
        shell: bash
        run: |
          set -euxo pipefail
          find artifacts -type f | sort
          test -n "$(find artifacts -name '*.apk' -type f)"

      # 发布说明原来是在下面硬编码的 0.8.7 文案，之后每版都忘了改，
      # 于是每个 Release 都写着 0.8.7。现在从 README 的「更新」章节里
      # 抓出当前版本的所有 `### <版本> · <主题>` 小节，生成主题清单。
      # 版本号取自 pubspec.yaml，改版本时两处自动对齐。
      - name: Compose release notes
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -n1)
          if [ -z "$version" ]; then
            echo "pubspec.yaml 里没读到版本号" >&2
            exit 1
          fi
          titles=$(LC_ALL=C awk -v v="$version" '
            /^### / {
              if (index($0, "### " v " · ") == 1) {
                print "- " substr($0, length("### " v " · ") + 1)
              }
            }
          ' README.md)
          {
            echo "## $version"
            echo
            if [ -n "$titles" ]; then
              printf '%s\n' "$titles"
            else
              echo "本版构建产物见下方附件，详细说明见 README 的更新章节。"
            fi
            echo
            echo "**产物**：\`all\` / \`arm64-v8a\` / \`armeabi-v7a\`"
            echo
            echo "**构建环境**：Flutter 3.47.4 / Go 1.24.1 / NDK 28.2.13676358"
            echo
            echo "详细说明见 [README 的更新章节](https://github.com/ai0by/zhenguojianTV/blob/main/README.md#二更新)。"
          } > release_body.md
          echo "--- release_body.md ---"
          cat release_body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: artifacts/**/*.apk
          body_path: release_body.md
