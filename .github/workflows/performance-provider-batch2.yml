name: Performance and provider batch 2

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: performance-provider-batch2
  cancel-in-progress: true

jobs:
  optimize:
    if: github.event.head_commit.message != 'Optimize hidden downloads and provider mirrors verified'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply performance and provider changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f'{path}: source anchor not found')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_exact(
              'lib/downloads_screen.dart',
              '    this.embedded = false,\n    this.playerBuilder,\n  });\n  final AppRepository repository;\n  final LocalStore store;\n  final bool embedded;',
              '    this.embedded = false,\n    this.active = true,\n    this.playerBuilder,\n  });\n  final AppRepository repository;\n  final LocalStore store;\n  final bool embedded;\n\n  /// 嵌入主界面时仅当前标签激活轮询。独立打开下载页保持默认 true。\n  final bool active;',
          )
          replace_exact(
              'lib/downloads_screen.dart',
              '    widget.store.addListener(_changed);\n    _refresh();\n    _timer = Timer.periodic(const Duration(seconds: 2), (_) => _refresh());\n  }\n\n  void _changed() {',
              '    widget.store.addListener(_changed);\n    if (widget.active) _startPolling();\n  }\n\n  void _startPolling() {\n    if (_timer != null || !widget.active || !_allowed) return;\n    unawaited(_refresh());\n    _timer = Timer.periodic(const Duration(seconds: 2), (_) {\n      if (widget.active) unawaited(_refresh());\n    });\n  }\n\n  void _stopPolling() {\n    _timer?.cancel();\n    _timer = null;\n  }\n\n  @override\n  void didUpdateWidget(covariant DownloadsScreen oldWidget) {\n    super.didUpdateWidget(oldWidget);\n    if (oldWidget.active == widget.active) return;\n    if (widget.active) {\n      _startPolling();\n    } else {\n      _stopPolling();\n    }\n  }\n\n  void _changed() {',
          )
          replace_exact(
              'lib/downloads_screen.dart',
              '    _stopBatch = true;\n    _timer?.cancel();',
              '    _stopBatch = true;\n    _stopPolling();',
          )
          replace_exact(
              'lib/home_screen.dart',
              "  int _generation = 0;\n  int _tab = 0;\n  String _submittedQuery = '';",
              "  int _generation = 0;\n  int _tab = 0;\n  bool _downloadVisited = false;\n  String _submittedQuery = '';",
          )
          replace_exact(
              'lib/home_screen.dart',
              '    // 进软件优先打开「首页」（竖滑视频流）。\n    _tab = widget.initialTab ?? _feedIndex;\n    _browser = CatalogBrowser(widget.repository);',
              '    // 进软件优先打开「首页」（竖滑视频流）。\n    _tab = widget.initialTab ?? _feedIndex;\n    if (!widget.store.canDownload && _tab == _downloadIndex) {\n      _tab = _feedIndex;\n    }\n    _downloadVisited = _tab == _downloadIndex;\n    _browser = CatalogBrowser(widget.repository);',
          )
          replace_exact(
              'lib/home_screen.dart',
              '  void _changeTab(int tab) => setState(() {\n    _tab = tab;\n    _selectionMode = false;\n    _selectedDramas.clear();\n  });',
              '  void _changeTab(int tab) => setState(() {\n    _tab = tab;\n    if (tab == _downloadIndex) _downloadVisited = true;\n    _selectionMode = false;\n    _selectedDramas.clear();\n  });',
          )
          replace_exact(
              'lib/home_screen.dart',
              '                      if (widget.store.canDownload)\n                        DownloadsScreen(\n                          repository: widget.repository,\n                          store: widget.store,\n                          embedded: true,\n                        ),',
              '                      if (widget.store.canDownload)\n                        _downloadVisited\n                            ? DownloadsScreen(\n                                repository: widget.repository,\n                                store: widget.store,\n                                embedded: true,\n                                active: _tab == _downloadIndex,\n                              )\n                            : const SizedBox.shrink(),',
          )

          config = {
              'version': 1,
              'ttlSeconds': 3600,
              'sources': {
                  'huangguoai': [
                      'https://huangguoai.com',
                      'https://thu.agdkczeyx.cc',
                      'https://ttvoij.ediayikma.cc',
                      'https://thu.ediayikma.cc',
                      'https://pku.ediayikma.cc',
                      'https://fdu.ediayikma.cc',
                  ],
                  'huangguo-video': ['https://huangguo.video'],
                  'huangdou': ['https://tideember.cc', 'https://xqjurgek.top'],
                  'huangju': ['https://huangju.net'],
                  'huangju-api': ['https://api.huangju.net'],
                  'cloudfront': [
                      'https://d2pypzndaqisk.cloudfront.net',
                      'https://d18ka9rqpfd3lo.cloudfront.net',
                      'https://d37n0wjehmw08f.cloudfront.net',
                  ],
              },
          }
          Path('config/source_mirrors.json').write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          cat > test/downloads_polling_test.dart <<'DART'
          import 'package:duanju_app/downloads_screen.dart';
          import 'package:duanju_app/local_store.dart';
          import 'package:duanju_app/models.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          import 'fixtures.dart';

          class _PollingRepository extends FixtureRepository {
            int downloadCalls = 0;

            @override
            bool get supportsDownloads => true;

            @override
            Future<List<DownloadJob>> downloads() async {
              downloadCalls++;
              return const [];
            }
          }

          void main() {
            testWidgets(
              'hidden DownloadsScreen does not poll and resumes only while active',
              (tester) async {
                SharedPreferences.setMockInitialValues(const {});
                final store = LocalStore(await SharedPreferences.getInstance());
                addTearDown(store.dispose);
                final repository = _PollingRepository();
                final active = ValueNotifier<bool>(false);
                addTearDown(active.dispose);

                await tester.pumpWidget(
                  MaterialApp(
                    home: ValueListenableBuilder<bool>(
                      valueListenable: active,
                      builder: (context, value, child) => DownloadsScreen(
                        repository: repository,
                        store: store,
                        active: value,
                      ),
                    ),
                  ),
                );
                await tester.pump(const Duration(seconds: 3));
                expect(repository.downloadCalls, 0);

                active.value = true;
                await tester.pump();
                await tester.pump(const Duration(milliseconds: 50));
                expect(repository.downloadCalls, 1);

                await tester.pump(const Duration(seconds: 2));
                await tester.pump(const Duration(milliseconds: 50));
                expect(repository.downloadCalls, greaterThanOrEqualTo(2));

                active.value = false;
                await tester.pump();
                final pausedAt = repository.downloadCalls;
                await tester.pump(const Duration(seconds: 3));
                expect(repository.downloadCalls, pausedAt);
              },
            );
          }
          DART

      - name: Native source mirror regression
        shell: bash
        run: |
          cd native
          go test ./core -run 'Test(ParseProviderMirrorDocument|InvalidProviderMirrorDocumentFallsBack|ProviderMirrorConfigUsesJsDelivr|ValidProviderMirrorOriginRejectsUnsafeAddresses|ProviderBaseCandidatesPrefersRememberedThenRemoteThenBuiltin|ProviderURLCandidatesDynamicPreservesPathAndQuery)$' -count=1

      - name: Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Verify phone and TV focused regressions
        shell: bash
        run: |
          flutter pub get
          dart format lib/downloads_screen.dart lib/home_screen.dart test/downloads_polling_test.dart
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test --dart-define=ALL_SOURCES=true --concurrency=1 \
            test/downloads_polling_test.dart \
            test/app_bottom_navigation_test.dart \
            test/tv_shared_apk_navigation_test.dart \
            test/television_test.dart \
            test/tv_player_remote_test.dart

      - name: Commit verified optimization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/downloads_screen.dart lib/home_screen.dart config/source_mirrors.json test/downloads_polling_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "Optimize hidden downloads and provider mirrors verified"
          git pull --rebase origin main
          git push origin HEAD:main
