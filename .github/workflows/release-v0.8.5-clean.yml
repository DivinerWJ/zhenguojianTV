name: Release Clean TV v0.8.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.8.5-clean.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go 1.24.1
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
          cache-dependency-path: native/go.sum

      - name: Set up Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install Android SDK 36 and NDK 28.2
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/tools" -type f -name sdkmanager -print -quit 2>/dev/null)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Make clean TV source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('pubspec.yaml')
          s = p.read_text()
          s = re.sub(r'^version:\s*[^\n]+$', 'version: 0.8.5+80', s, flags=re.M)
          s = re.sub(r'^\s*flutter_foreground_task:\s*[^\n]+\n', '', s, flags=re.M)
          p.write_text(s)

          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          for permission in [
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_DATA_SYNC',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.REQUEST_INSTALL_PACKAGES',
          ]:
              s = re.sub(r'\s*<uses-permission android:name="' + re.escape(permission) + r'"/>\n', '\n', s)
          s = re.sub(r'\s*<service android:name="com\.pravera\.flutter_foreground_task\.service\.ForegroundService"\s*\n\s*android:foregroundServiceType="dataSync" android:exported="false" android:stopWithTask="false"/>\n', '\n', s)
          s = re.sub(r'\s*<provider\s*\n\s*android:name="androidx\.core\.content\.FileProvider"\s*\n\s*android:authorities="\$\{applicationId\}\.updateprovider"\s*\n\s*android:exported="false"\s*\n\s*android:grantUriPermissions="true">\s*\n\s*<meta-data\s*\n\s*android:name="android\.support\.FILE_PROVIDER_PATHS"\s*\n\s*android:resource="@xml/update_paths"/>\s*\n\s*</provider>\n', '\n', s)
          p.write_text(s)

          Path('lib/background_downloads.dart').write_text("""/// Clean TV build: Android foreground-service notifications are disabled.\n/// Downloads/media work stays in the app process and never requests notification permission.\nclass BackgroundDownloads {\n  static Future<void> prepare() async {}\n  static Future<void> ensureStarted() async {}\n}\n""")

          p = Path('lib/main.dart')
          s = p.read_text().replace("import 'app_updater.dart';\n", '')
          block = """        // 界面就绪后检查更新（仅 Android；失败静默跳过，不阻塞启动）。\n        WidgetsBinding.instance.addPostFrameCallback((_) {\n          final target = navigator.currentContext;\n          if (target != null) {\n            unawaited(AppUpdater.checkOnStartup(target));\n          }\n        });\n"""
          if block not in s:
              raise SystemExit('startup update block not found')
          p.write_text(s.replace(block, ''))

          p = Path('lib/home_screen.dart')
          lines = p.read_text().replace("import 'app_updater.dart';\n", '').splitlines(keepends=True)
          idx = next((i for i, line in enumerate(lines) if 'about-check-update' in line), None)
          if idx is None:
              raise SystemExit('manual update button not found')
          start = idx
          while start >= 0 and lines[start].strip() != 'Align(':
              start -= 1
          if start < 0:
              raise SystemExit('manual update Align start not found')
          if start > 0 and 'SizedBox(height: 8)' in lines[start - 1]:
              start -= 1
          balance = 0
          seen = False
          end = start
          for j in range(start, len(lines)):
              balance += lines[j].count('(') - lines[j].count(')')
              if '(' in lines[j]:
                  seen = True
              end = j
              if seen and balance <= 0 and j >= idx:
                  break
          del lines[start:end + 1]
          p.write_text(''.join(lines))

          p = Path('android/app/src/main/kotlin/com/duanju/duanju_app/MainActivity.kt')
          s = p.read_text()
          for imp in ['import android.content.Intent\n', 'import androidx.core.content.FileProvider\n', 'import java.io.File\n']:
              s = s.replace(imp, '')
          start = s.find('        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "duanju/updater")')
          marker = '\n    }\n\n    /** 是否已被系统授予「安装未知应用」权限。 */'
          if start < 0 or marker not in s[start:]:
              raise SystemExit('native updater channel not found')
          stop = s.find(marker, start)
          s = s[:start] + s[stop:]
          start = s.find('    /** 是否已被系统授予「安装未知应用」权限。 */')
          stop = s.find('    /**\n     * 系统媒体音量（0.7.5）。', start)
          if start < 0 or stop < 0:
              raise SystemExit('native updater permission helper not found')
          s = s[:start] + s[stop:]
          start = s.find('    /** 打开本应用的「安装未知应用」设置页。 */')
          if start < 0:
              raise SystemExit('native updater tail not found')
          close = s.rfind('\n}')
          s = s[:start] + s[close:]
          p.write_text(s)

          for name in ['lib/app_updater.dart', 'android/app/src/main/res/xml/update_paths.xml']:
              q = Path(name)
              if q.exists():
                  q.unlink()

          p = Path('README.md')
          s = p.read_text().replace('当前版本：**0.8.4+79**', '当前版本：**0.8.5+80**')
          s = re.sub(r'## 二、本次更新（[^\n]+）\n.*?\n## 三、快速开始', '''## 二、本次更新（0.8.5）\n\n- **纯净体验**：不集成广告 SDK，不展示广告位或推广弹窗。\n- **取消系统通知**：移除通知权限、Android 前台服务及下载常驻通知。\n- **取消应用内更新机制**：启动时不检查版本，不弹更新框，也不申请“安装未知应用”权限。\n- **保留必要交互反馈**：播放失败、下载失败、用户主动操作结果仍会正常提示，避免出现“点了没反应”。\n- **保留 TV / 拼音搜索能力**：遥控器适配、全拼/首字母搜索等 0.8.4 能力不变。\n\n> 后续版本由用户自行在 GitHub Releases 页面查看和下载安装，App 本身不主动检测。\n\n## 三、快速开始''', s, flags=re.S)
          s = s.replace('3. 打开即用；之后有新版本时，App 内会提示更新。', '3. 打开即用；App 不进行自动更新检测，后续版本请自行查看 Releases。')
          p.write_text(s)
          PY
          flutter pub get

      - name: Audit intrusive mechanisms
        shell: bash
        run: |
          set -euo pipefail
          intrusive='AppUpdater|app_updater|checkOnStartup|duanju/updater|REQUEST_INSTALL_PACKAGES|updateprovider|installApk|openInstallSettings|flutter_foreground_task|POST_NOTIFICATIONS|FOREGROUND_SERVICE|ForegroundService|requestNotificationPermission|notificationTitle|notificationText'
          ads='google_mobile_ads|admob|applovin|unity_ads|unityads|ironsource|pangle|gdtmob|穿山甲|优量汇'
          echo '--- intrusive matches ---'
          grep -R -nE "$intrusive" lib android pubspec.yaml pubspec.lock 2>/dev/null || true
          echo '--- ad SDK matches ---'
          grep -R -niE "$ads" lib android pubspec.yaml pubspec.lock 2>/dev/null || true
          if grep -R -qE "$intrusive" lib android pubspec.yaml pubspec.lock 2>/dev/null; then exit 1; fi
          if grep -R -qiE "$ads" lib android pubspec.yaml pubspec.lock 2>/dev/null; then exit 1; fi
          grep -q '^version: 0.8.5+80$' pubspec.yaml
          grep -q '不集成广告 SDK' README.md
          grep -q '取消系统通知' README.md
          grep -q '不进行自动更新检测' README.md

      - name: Validate source
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=scripts python3 -m unittest scripts.test_app_build -v
          flutter test test/pinyin_test.dart

      - name: Build real TV APKs
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/build_android.py --tv --universal --all-sources

      - name: Verify APKs
        shell: bash
        run: |
          set -euxo pipefail
          ALL=dist/android/zhenguojian-0.8.5+80-all.apk
          ARM64=dist/android/zhenguojian-0.8.5+80-arm64-v8a.apk
          test -s "$ALL"
          test -s "$ARM64"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$ALL"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$ARM64"
          python3 - <<'PY'
          import zipfile
          files = {
              'dist/android/zhenguojian-0.8.5+80-all.apk': ['arm64-v8a', 'armeabi-v7a'],
              'dist/android/zhenguojian-0.8.5+80-arm64-v8a.apk': ['arm64-v8a'],
          }
          required = ['libduanju_core.so', 'libflutter.so', 'libapp.so', 'libmpv.so', 'libffmpegkit.so']
          for path, abis in files.items():
              with zipfile.ZipFile(path) as archive:
                  names = set(archive.namelist())
              for abi in abis:
                  for library in required:
                      assert f'lib/{abi}/{library}' in names, (path, abi, library)
              print(path, ','.join(abis), 'OK')
          PY

      - name: Commit clean source to main
        shell: bash
        run: |
          set -euxo pipefail
          rm -f .github/workflows/release-v0.8.5-clean.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '0.8.5+80: clean TV release without notifications or auto update'
          git push origin HEAD:main

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euxo pipefail
          ALL=dist/android/zhenguojian-0.8.5+80-all.apk
          ARM64=dist/android/zhenguojian-0.8.5+80-arm64-v8a.apk
          cp "$ALL" /tmp/zhenguojian-TV-v0.8.5-all.apk
          cp "$ARM64" /tmp/zhenguojian-TV-v0.8.5-arm64-v8a.apk
          sha256sum /tmp/zhenguojian-TV-v0.8.5-all.apk /tmp/zhenguojian-TV-v0.8.5-arm64-v8a.apk > /tmp/SHA256SUMS.txt
          cat > /tmp/release-notes.md <<'EOF'
          ## 真果鉴 TV v0.8.5

          本版以减少干扰为目标：

          - 移除 Android 通知权限与前台下载常驻通知；
          - 移除应用启动自动检查更新；
          - 移除应用内 APK 下载/安装更新通道；
          - 不集成广告 SDK，不展示广告位或推广弹窗；
          - 保留必要的错误提示与用户主动操作反馈；
          - 保留 TV 遥控器适配、全拼/拼音首字母搜索等现有功能。

          **注意：** 去掉 Android 前台服务后，长时间下载/媒体处理建议保持 App 在前台；切到后台后系统可能暂停进程。

          ### APK
          - `zhenguojian-TV-v0.8.5-all.apk`：TV 通用 ARM 包，包含 arm64-v8a + armeabi-v7a；
          - `zhenguojian-TV-v0.8.5-arm64-v8a.apk`：64 位 ARM 电视/盒子优先使用。
          EOF
          TARGET=$(git rev-parse HEAD)
          gh release create v0.8.5 \
            /tmp/zhenguojian-TV-v0.8.5-all.apk \
            /tmp/zhenguojian-TV-v0.8.5-arm64-v8a.apk \
            /tmp/SHA256SUMS.txt \
            --repo ai0by/zhenguojianTV \
            --target "$TARGET" \
            --title '真果鉴 TV v0.8.5' \
            --notes-file /tmp/release-notes.md
